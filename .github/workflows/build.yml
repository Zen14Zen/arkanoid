name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pygame pyinstaller
      - run: pyinstaller --onefile --noconsole --name arkanoid main.py
      - uses: actions/upload-artifact@v4
        with:
          name: arkanoid-exe
          path: dist/arkanoid.exe
